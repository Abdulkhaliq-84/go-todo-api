# oapi-codegen configuration. Consumed by `make generate`.
#
# What gets generated into internal/todo/http/openapi_gen.go:
#   models          -- Go structs for every schema in the spec
#   std-http-server -- a ServerInterface your Handler must satisfy, plus a
#                      ServeMux wiring function
#   strict-server   -- typed handler signatures: you receive a parsed request
#                      struct and RETURN a typed response, instead of writing to
#                      a ResponseWriter. Much closer to an Express handler that
#                      returns res.json(...), and it makes handlers testable as
#                      plain functions.
#
# NOTE: this changes the shape of the handlers already scaffolded in handler.go.
# That is the point -- the generated interface becomes the contract, and the
# compiler enforces that the code matches the spec.

package: http
# Relative to the directory `go generate` runs in, which is the package holding
# the //go:generate directive -- internal/todo/http.
output: openapi_gen.go

generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: false

output-options:
  # Skip pruning so every schema stays available even before handlers use it.
  skip-prune: true

  # Maps a field that is BOTH optional and nullable to nullable.Nullable[T],
  # which distinguishes three states a plain pointer cannot:
  #     absent  -> client did not send the field  -> leave it alone
  #     null    -> client sent null               -> clear it
  #     value   -> set it
  # This is what makes correct PATCH semantics expressible. A *time.Time would
  # collapse "absent" and "null" into nil, so a PATCH that omitted due_date
  # would silently clear it. TypeScript has the same problem and solves it the
  # same way -- `T | null | undefined` rather than `T | null`.
  nullable-type: true
  # Generated code is not yours to edit; the header says so loudly.
  user-templates: {}
